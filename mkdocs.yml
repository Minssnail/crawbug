# Intelligent Textbook — MkDocs Material configuration.
# Generated by the init-textbook skill. Customize as the book grows.
# Use the book-installer skill to add features incrementally
# (math, mascot, slides, learning graph viewer, etc.).

site_name: '网络爬虫技术'
site_description: '面向高职专科人工智能技术应用专业的交互式智能教材，系统讲授利用网络爬虫采集、解析与存储AI训练数据的原理与工程方法。'
site_author: 'AI教材编写组'
site_url: 'https://minssnail.github.io/crawbug/'

# Hooks — runs local Python before/after page processing.
hooks:
  - plugins/social_override.py

# Repository
repo_name: 'Minssnail/crawbug'
repo_url: 'https://github.com/Minssnail/crawbug'
edit_uri: 'blob/main/docs'

# Copyright
copyright: 'Copyright &copy; 2026 AI教材编写组. Licensed under <a href="license/">CC BY-NC-SA 4.0</a> for non-commercial use.'

# Navigation
# IMPORTANT: do NOT add `navigation.tabs` — these books use side navigation
# optimized for wide landscape screens.
nav:
  - Home: index.md
  - About: about.md
  - Course Description: course-description.md

  - Chapters:
      - List of Chapters: chapters/index.md
      - 1. 网络爬虫导论与数据合规基石: chapters/01-intro-and-ethics/index.md
      - 2. Web前端基石与HTTP通信原理: chapters/02-web-and-http-fundamentals/index.md
      - 3. Python网络请求核心编程: chapters/03-python-http-requests/index.md
      - 4. 静态网页结构化解析与正则提取: chapters/04-static-html-parsing/index.md
      - 5. 异步加载与Web接口逆向采集: chapters/05-ajax-and-api-scraping/index.md
      - 6. 动态渲染网页与Playwright浏览器自动化: chapters/06-browser-automation-playwright/index.md
      - 7. 反爬虫机制原理与工程对抗策略: chapters/07-anti-scraping-and-countermeasures/index.md
      - 8. 高性能并发与异步协程爬虫编程: chapters/08-concurrent-and-async-scraping/index.md
      - 9. 数据清洗流水线与多源持久化存储: chapters/09-data-cleaning-and-storage/index.md
      - 10. Scrapy工业级异步爬虫框架实战: chapters/10-scrapy-industrial-framework/index.md
      - 11. 面向大模型与RAG的AI智能爬虫: chapters/11-ai-powered-scraping-and-datasets/index.md
      - 12. 爬虫工程化运维部署与综合实训项目: chapters/12-engineering-deployment-and-capstone/index.md

  - Learning Graph:
      - Introduction: learning-graph/index.md
      - Course Description Assessment: learning-graph/course-description-assessment.md
      - Concept Enumeration: learning-graph/concept-list.md
      - Concept Taxonomy: learning-graph/concept-taxonomy.md
      - Graph Quality Analysis: learning-graph/quality-metrics.md
      - Taxonomy Distribution: learning-graph/taxonomy-distribution.md

  - MicroSims:
      - List of MicroSims: sims/index.md

  - Glossary: glossary.md
  - License: license.md
  - Contact: contact.md

# Theme configuration
theme:
  name: material
  palette:
    primary: 'indigo'
    accent: 'orange'
  include_sidebar: true
  features:
    - content.code.copy
    - content.action.edit
    - navigation.expand
    - navigation.path
    - navigation.prune
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share

# Plugins
plugins:
  - search

# Markdown extensions
markdown_extensions:
  - md_in_html
  - admonition
  - attr_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.arithmatex:
      generic: true

# Custom CSS — file is created by init-textbook
extra_css:
  - css/extra.css

# Exclude prompt scratch files and TODOs from build/search/sitemap
exclude_docs: |
  **/image-prompt*.md
  **/image-prompts*.md
  **/cover-prompt.md
  **/TODO.md

# Rebuild on changes during `mkdocs serve`
watch:
  - docs
  - mkdocs.yml

# Extra
extra:
  generator: false
  status:
    scaffold: Scaffold — placeholder, not yet implemented
    built: Built — implementation complete, awaiting review
    approved: Approved — tested and approved
  schema: https://dmccreary.github.io/intelligent-textbooks/ns/textbook/v1
  textbook_name: '网络爬虫技术'
  textbook_version: '1.0'
